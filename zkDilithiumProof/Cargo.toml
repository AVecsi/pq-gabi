[package]
name = "zkDilithiumProof"
version = "0.1.0"
edition = "2021"

[features]
concurrent = ["winterfell/concurrent", "std"]
default = ["std"]
std = ["hex/std", "winterfell/std"]

[lib]
# If you only wanted dynamic library, you'd use only "cdylib".
# If you only wanted static library, you'd use only "staticlib".
# This demo shows both. See https://doc.rust-lang.org/reference/linkage.html
# for more information.
crate-type = ["cdylib", "staticlib"]


[dependencies]
winterfell = {git = "https://github.com/avecsi/winterfell", branch = "f23-zk"}
winter-utils = "0.13.1"
winter-rand-utils = "0.13.1"
hex = { version = "0.4.3", optional = true }
log = { version = "0.4", default-features = false }
blake3 = { version = "1.8.2", default-features = false }
env_logger = { version = "0.9", default-features = false }
generic_singleton = "0.5.1"
atomic_refcell = "0.1.9"
rand_chacha = { version = "0.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
panic = "unwind"  # Allows the panic message to propagate

[patch.crates-io]
winter-utils = { git = "https://github.com/AVecsi/winterfell", branch = "f23-zk" }